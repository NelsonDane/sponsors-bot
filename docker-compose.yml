services:
  web:
    image: ghcr.io/nelsondane/sponsors-bot-web:latest@sha256:5df27965c8ba8d16be3e1e065bd43a62c1ae9b32a5e44b4afdd8937bf3029e61
    # build:
    #   context: .
    #   dockerfile: Dockerfile.web
    container_name: web
    restart: always
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - 8080:8080
    depends_on:
      - db
      - bot

  cloudflare:
    image: cloudflare/cloudflared:latest@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: cloudflare
    restart: always
    command: tunnel run --token ${CLOUDFLARE_TOKEN}

  bot:
    image: ghcr.io/nelsondane/sponsors-bot:latest@sha256:e933b7b9d2c4b852fc304826176de88835463e07e5d202e306c6c26a2716f845
    # build:
    #   context: .
    #   dockerfile: Dockerfile.bot
    # platform: linux/amd64
    container_name: bot
    restart: always
    volumes:
      - ./config.yaml:/app/config.yaml
    depends_on:
      - db

  db:
    image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sponsors
    volumes:
      - ./db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d sponsors -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    hostname: watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_POLL_INTERVAL=3600
    command:
      - bot
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
